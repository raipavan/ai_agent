<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uday Auto Link — Sign In</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#4A8CC8 0%,#6BA3D6 40%,#8FBDE3 70%,#B5D5EF 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.15);width:400px;padding:48px 40px}
.logo-area{text-align:center;margin-bottom:36px}
.logo-circle{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#3B7DD8,#5A9AE0);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:800;margin-bottom:12px}
.brand{font-size:24px;font-weight:800;color:#1a1a2e}
.sub{font-size:13px;color:#6b7280;margin-top:4px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
.form-group input{width:100%;padding:12px 14px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:14px;transition:border .2s;outline:none}
.form-group input:focus{border-color:#3B7DD8;box-shadow:0 0 0 3px rgba(59,125,216,.12)}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg,#3B7DD8,#2A5FA0);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(59,125,216,.35)}
.btn:active{transform:translateY(0)}
.error{color:#dc2626;font-size:13px;text-align:center;margin-top:12px;display:none}
.error.show{display:block}
.footer{text-align:center;margin-top:24px;font-size:12px;color:#9ca3af}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo-area">
    <div class="logo-circle">U</div>
    <div class="brand">Uday Auto Link</div>
    <div class="sub">Maruti Suzuki Arena — Kathwada</div>
  </div>
  <form id="loginForm" onsubmit="return handleLogin(event)">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="uday@autolink.com" value="uday@autolink.com" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" value="admin123" required>
    </div>
    <button type="submit" class="btn" id="loginBtn">Sign In</button>
    <div class="error" id="errorMsg"></div>
  </form>
  <div class="footer">Powered by Uday Auto Link &bull; Maruti Suzuki Arena</div>
</div>
<script>
function handleLogin(e){
  e.preventDefault();
  var email=document.getElementById('email').value;
  var pass=document.getElementById('password').value;
  if(!email||!pass){showError('Please fill all fields');return false}
  localStorage.setItem('vernika_token','demo_token_123');
  localStorage.setItem('vernika_role','maruti');
  localStorage.setItem('vernika_email',email);
  document.getElementById('loginBtn').innerText='Authorized';
  document.getElementById('loginBtn').style.background='#34C759';
  setTimeout(function(){window.location.href='/console'},600);
  return false;
}
function showError(msg){var el=document.getElementById('errorMsg');el.innerText=msg;el.classList.add('show')}
</script>
</body>
</html>
